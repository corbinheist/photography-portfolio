name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Validate content references
        run: pnpm validate:content

      - name: Type check & build
        run: pnpm build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          PUBLIC_MAPTILER_KEY: ${{ secrets.PUBLIC_MAPTILER_KEY }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e:built

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Upload to a staging folder first, then mirror it onto the live folder. The mirror
      # (rsync --delete) removes files the build no longer produces; a plain copy left them public.
      - name: Upload to the staging folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: dist/*
          target: portfolio-next
          strip_components: 1
          rm: true

      - name: Publish the staging folder and reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -eu
            NEXT="$HOME/portfolio-next"
            # Stop before touching the live site if the upload is incomplete.
            test -f "$NEXT/index.html"
            rsync -a --delete "$NEXT/" /var/www/portfolio/
            rm -rf "$NEXT"
            sudo systemctl reload nginx
